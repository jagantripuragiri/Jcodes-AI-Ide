name: Build and Release J Code's (Mac, Windows, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with installers'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (e.g. v1.4.9)'
        required: false
        default: 'v1.4.9'

permissions:
  contents: write

jobs:
  # ==========================================
  # 🍏 macOS: Apple Silicon (M1/M2/M3/M4)
  # ==========================================
  build-macos-arm64:
    name: 🍏 macOS (Apple Silicon arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app decides whether an update exists by comparing the latest GitHub release tag with the version baked into
      # product.json, so the build must carry exactly the version of the release it is published under.
      - name: Stamp version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Release tag '$RELEASE_TAG' must look like v1.7 or v1.7.0 - refusing to build with a wrong version."
            exit 1
          fi
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.jcodesVersion=process.argv[1];fs.writeFileSync('product.json',JSON.stringify(p,null,'\t')+'\n')" "$VERSION"
          grep jcodesVersion product.json

      - name: Install Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_github_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install

      - name: Build React Components
        run: npm run buildreact

      - name: Compile and Package macOS arm64
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-darwin-arm64

      - name: Create macOS arm64 ZIP
        run: |
          cd ../VSCode-darwin-arm64
          zip -r -y -X "${{ github.workspace }}/J-Codes-darwin-arm64.zip" "J Codes.app"

      - name: Upload macOS arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J-Codes-darwin-arm64
          path: J-Codes-darwin-arm64.zip

  # ==========================================
  # 🪟 Windows: 64-bit Setup Installer (.exe)
  # ==========================================
  build-windows:
    name: 🪟 Windows (x64 Installer)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app decides whether an update exists by comparing the latest GitHub release tag with the version baked into
      # product.json, so the build must carry exactly the version of the release it is published under.
      - name: Stamp version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Release tag '$RELEASE_TAG' must look like v1.7 or v1.7.0 - refusing to build with a wrong version."
            exit 1
          fi
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.jcodesVersion=process.argv[1];fs.writeFileSync('product.json',JSON.stringify(p,null,'\t')+'\n')" "$VERSION"
          grep jcodesVersion product.json

      - name: Install Dependencies
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_github_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install

      - name: Build React Components
        run: npm run buildreact

      - name: Compile and Package Windows App
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64

      - name: Stamp J_ icon onto app executable
        shell: bash
        run: |
          node -e "
          const rcedit = require('rcedit');
          const path = require('path');
          const exe = path.resolve('..', 'VSCode-win32-x64', \"J Codes.exe\");
          rcedit(exe, { icon: path.resolve('resources/win32/code.ico') }, err => {
            if (err) { console.error(err); process.exit(1); }
            console.log('Icon applied to', exe);
          });
          "

      - name: Build InnoSetup Windows Installer (.exe)
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64-user-setup

      - name: Prepare Windows Installer
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path ".build\win32-x64\user-setup\*.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName -Destination "${{ github.workspace }}\J-Codes-UserSetup-x64.exe"
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: J-Codes-Windows-Installer
          path: J-Codes-UserSetup-x64.exe

  # ==========================================
  # 🐧 Linux: Debian / Ubuntu (.deb package)
  # ==========================================
  build-linux:
    name: 🐧 Linux (x64 .deb Package)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev fakeroot dpkg-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The app decides whether an update exists by comparing the latest GitHub release tag with the version baked into
      # product.json, so the build must carry exactly the version of the release it is published under.
      - name: Stamp version from release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "Release tag '$RELEASE_TAG' must look like v1.7 or v1.7.0 - refusing to build with a wrong version."
            exit 1
          fi
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.jcodesVersion=process.argv[1];fs.writeFileSync('product.json',JSON.stringify(p,null,'\t')+'\n')" "$VERSION"
          grep jcodesVersion product.json

      - name: Install Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_github_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          # npm 10.9.9 silently exits 1 while installing git deps (extensions/open-remote-ssh); 10.9.8 is the last known good
          npm install -g npm@10.9.8
          npm install

      - name: Build React Components
        run: npm run buildreact

      - name: Compile and Package Linux App
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-linux-x64

      - name: Prepare and Build Debian .deb Package
        run: |
          node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-prepare-deb
          node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-build-deb

      - name: Prepare Linux .deb Artifact
        run: |
          debFile=$(find .build/linux/deb/amd64/deb/ -name "*.deb" | head -n 1)
          if [ -f "$debFile" ]; then
            cp "$debFile" "${{ github.workspace }}/j-codes_amd64.deb"
          fi

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: J-Codes-Linux-deb
          path: j-codes_amd64.deb

  # ==========================================
  # 🚀 Publish Release to GitHub
  # ==========================================
  release:
    name: 🚀 Publish Official GitHub Release
    needs: [build-macos-arm64, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Determine Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "J Code's ${{ steps.tag.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./dist/J-Codes-darwin-arm64.zip
            ./dist/J-Codes-UserSetup-x64.exe
            ./dist/j-codes_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
