name: Build and Release J Code's (Mac, Windows, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with installers'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (e.g. v1.4.9)'
        required: false
        default: 'v1.4.9'

permissions:
  contents: write

jobs:
  # ==========================================
  # 🍏 macOS: Apple Silicon (M1/M2/M3/M4)
  # ==========================================
  build-macos-arm64:
    name: 🍏 macOS (Apple Silicon arm64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install

      - name: Build React Components
        run: npm run buildreact

      - name: Compile and Package macOS arm64
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-darwin-arm64

      - name: Create macOS arm64 ZIP
        run: |
          cd ../VSCode-darwin-arm64
          zip -r -y -X "${{ github.workspace }}/J-Codes-darwin-arm64.zip" "J code's.app"

      - name: Upload macOS arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J-Codes-darwin-arm64
          path: J-Codes-darwin-arm64.zip

  # ==========================================
  # 🪟 Windows: 64-bit Setup Installer (.exe)
  # ==========================================
  build-windows:
    name: 🪟 Windows (x64 Installer)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        shell: bash
        run: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install

      - name: Build React Components
        run: npm run buildreact

      - name: Compile and Package Windows App
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64

      - name: Build InnoSetup Windows Installer (.exe)
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-win32-x64-user-setup

      - name: Prepare Windows Installer
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path ".build\win32-x64\user-setup\*.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName -Destination "${{ github.workspace }}\J-Codes-UserSetup-x64.exe"
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: J-Codes-Windows-Installer
          path: J-Codes-UserSetup-x64.exe

  # ==========================================
  # 🐧 Linux: Debian / Ubuntu (.deb package)
  # ==========================================
  build-linux:
    name: 🐧 Linux (x64 .deb Package)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev fakeroot dpkg-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm install

      - name: Build React Components
        run: npm run buildreact

      - name: Compile and Package Linux App
        run: node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-linux-x64

      - name: Prepare and Build Debian .deb Package
        run: |
          node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-prepare-deb
          node --max-old-space-size=8192 ./node_modules/gulp/bin/gulp.js vscode-linux-x64-build-deb

      - name: Prepare Linux .deb Artifact
        run: |
          debFile=$(find .build/linux/deb/amd64/deb/ -name "*.deb" | head -n 1)
          if [ -f "$debFile" ]; then
            cp "$debFile" "${{ github.workspace }}/j-codes_amd64.deb"
          fi

      - name: Upload Linux .deb
        uses: actions/upload-artifact@v4
        with:
          name: J-Codes-Linux-deb
          path: j-codes_amd64.deb

  # ==========================================
  # 🚀 Publish Release to GitHub
  # ==========================================
  release:
    name: 🚀 Publish Official GitHub Release
    needs: [build-macos-arm64, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: Determine Tag Name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "J Code's ${{ steps.tag.outputs.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./dist/J-Codes-darwin-arm64.zip
            ./dist/J-Codes-UserSetup-x64.exe
            ./dist/j-codes_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
